<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jardim - Izy Focus</title>
    <link rel="stylesheet" href="/garden/garden.css">
    <link rel="stylesheet" href="/garden/pixel-art.css">
    <link rel="stylesheet" href="/garden/achievements.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-logo">
                <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                </svg>
                <h1 data-i18n="garden_header">Meu Jardim</h1>
            </div>
            
            <div class="stats-bar">
                <div class="stat-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                    </svg>
                    <span id="seed-count-display">0</span>
                    <span data-i18n="garden_seeds_label">Sementes</span>
                </div>
                <div class="stat-item">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2l3 4 1-1 1 4-5-2-5 2 1-4 1 1 3-4z"/>
                    </svg>
                    <span id="stone-count-display">0</span>
                    <span data-i18n="garden_stones_label">Pedras</span>
                </div>
                <div class="stat-item">
                    <span id="level-display">Nível 1</span>
                </div>
            </div>
            
            <div class="xp-container">
                <span class="xp-label">XP</span>
                <span id="xp-value">0</span>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill" id="xp-bar-fill" style="width: 0%"></div>
                </div>
                <span id="xp-next">250</span>
            </div>
            
            <p data-i18n="garden_instructions">Complete sessões de foco para ganhar sementes e XP. Plante-as no seu jardim para watch them grow!</p>
            
            <div class="achievements-section">
                <button id="achievements-btn" class="button button-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 21h8M12 17v4M6 6h12v4a4 4 0 01-4 4H10a4 4 0 01-4-4V6zM6 10a2 2 0 100-4 2 2 0 000 4zM18 10a2 2 0 100-4 2 2 0 000 4z"/>
                    </svg>
                    <span data-i18n="garden_achievements_btn">Conquistas</span>
                </button>
            </div>
        </header>

        <div id="achievements-modal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 21h8M12 17v4M6 6h12v4a4 4 0 01-4 4H10a4 4 0 01-4-4V6zM6 10a2 2 0 100-4 2 2 0 000 4zM18 10a2 2 0 100-4 2 2 0 000 4z"/>
                    </svg>
                    <span data-i18n="garden_achievements_title">Conquistas</span>
                </h2>
                <div id="achievements-list" class="achievements-list"></div>
            </div>
        </div>

        <div class="toolbar">
            <div class="inventory">
                <div class="tool-item active" id="tool-select" data-tool="select">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                    </svg>
                    <span data-i18n="garden_tool_select">Selecionar</span>
                </div>
                <div class="tool-item" id="tool-seed" data-tool="seed">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                    </svg>
                    <span data-i18n="garden_tool_seeds">Plantar</span>
                    <span class="count" id="seed-count">0</span>
                </div>
                <div class="tool-item" id="tool-stone" data-tool="stone">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2l3 4 1-1 1 4-5-2-5 2 1-4 1 1 3-4z"/>
                    </svg>
                    <span data-i18n="garden_tool_stones">Colocar</span>
                    <span class="count" id="stone-count">0</span>
                </div>
            </div>
            <div class="garden-actions">
                <button id="reset-garden-btn" class="button button-danger">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                    <span data-i18n="garden_reset_button">Limpar</span>
                </button>
            </div>
        </div>

        <main id="garden-grid"></main>
    </div>
    <script src="/garden/garden.js"></script>
</body>
</html>
