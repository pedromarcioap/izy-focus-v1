<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jardim - Izy Focus</title>
    <link rel="stylesheet" href="garden.css">
    <link rel="stylesheet" href="garden-extra.css">
    <link rel="stylesheet" href="achievements.css">
    <link rel="stylesheet" href="pixel-art.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 data-i18n="garden_header">Meu Jardim da Intenção</h1>
            <div class="stats-bar">
                <div class="stat-item" id="level-display" data-i18n="garden_level">Nível 1</div>
                <div class="stat-item xp-container">
                    <span class="xp-label">XP</span>
                    <span id="xp-value" style="font-size: 0.9rem; margin-right: 8px; font-weight: 600; color: var(--accent-gold);">0 XP</span>
                    <div class="xp-bar-bg"><div class="xp-bar-fill" id="xp-bar-fill" style="width: 0%"></div></div>
                </div>
            </div>
            <div class="achievements-section">
                <button id="achievements-btn" class="button button-secondary" data-i18n="garden_achievements_btn">🏆 Ver Conquistas</button>
            </div>
            <p data-i18n="garden_instructions">Plante sementes de foco. Complete sessões para ganhar XP ✨ e evoluir suas plantas (Broto → Árvore → Árvore Florida). Se perder o foco em sites bloqueados, suas plantas podem murchar 🥀.</p>
        </header>

        <!-- Modal de Conquistas -->
        <div id="achievements-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 data-i18n="garden_achievements_title">Conquistas</h2>
                <div id="achievements-list" class="achievements-list">
                    <!-- Gerado via JS -->
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="inventory">
                <div class="tool-item active" id="tool-select" data-tool="select" data-i18n-title="garden_select_tooltip">
                    <span class="icon">🖐️</span>
                    <span class="label" data-i18n="garden_tool_select">Selecionar</span>
                </div>
                <div class="tool-item" id="tool-seed" data-tool="seed" data-i18n-title="garden_seed_tooltip">
                    <span class="icon">🌱</span>
                    <span class="label" data-i18n="garden_tool_seeds">Sementes</span>
                    <span class="count" id="seed-count">0</span>
                </div>
                <div class="tool-item" id="tool-stone" data-tool="stone" data-i18n-title="garden_stone_tooltip">
                    <span class="icon"><img src="../assets/icons/stone.svg" width="20" height="20"></span>
                    <span class="label" data-i18n="garden_tool_stones">Pedras</span>
                    <span class="count" id="stone-count">0</span>
                </div>
            </div>
            <div class="garden-actions">
                <button id="reset-garden-btn" class="button button-danger" data-i18n="garden_reset_button">Limpar Jardim</button>
            </div>
        </div>

        <main id="garden-grid">
            <!-- As células do jardim serão geradas pelo JavaScript -->
        </main>
    </div>
    <script src="garden.js"></script>
</body>
</html>
