<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jardim - Izy Focus</title>
    <link rel="stylesheet" href="../assets/common.css">
    <link rel="stylesheet" href="garden.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="main-header">
            <a href="../popup/popup.html" class="back-link">← Voltar</a>
            <h1>Meu Jardim</h1>
            <button id="edit-garden-btn" class="btn btn-secondary">Editar</button>

        <main>
            <div id="inventory" class="card">
                <h2>Inventário</h2>

            <div id="garden-display" class="card">
                <!-- A visualização do jardim (abstrata) será renderizada aqui pelo JS -->
            </div>
        </main>
    </div>
    <script src="garden.js"></script>

</html>
