<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Meu Jardim - Izy Focus</title>
    <link rel="stylesheet" href="../assets/common.css">
    <link rel="stylesheet" href="garden.css">
</head>
<body>
    <div class="app-container">
        <header class="main-header">
            <a href="../popup/popup.html" class="back-btn">‹</a>
            <h1 id="main-header-title">Meu Jardim</h1>

        <main class="garden-main-content">

                    <ul id="seeds-list"></ul>
                </div>
                <div id="stones-inventory" class="inventory-section">

        </main>
