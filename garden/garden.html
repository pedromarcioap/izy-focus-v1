<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jardim - Izy Focus</title>
    <link rel="stylesheet" href="garden.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meu Jardim da Intenção</h1>
            <p>Cultive seu espaço de foco e criatividade.</p>
        </header>

        <div class="garden-wrapper">
            <main id="garden-plot">
                <div class="garden-background"></div>
                <!-- Elementos do jardim serão adicionados aqui pelo JS -->
            </main>

            <aside class="side-panel">
                <h2>Inventário</h2>
                <div id="inventory-container">
                    <div class="tool-item" id="tool-seed" data-tool="seed" title="Plantar Semente">
                        <img src="../assets/icons/plant.svg" class="icon">
                        <span class="label">Sementes</span>
                        <span class="count" id="seed-count">0</span>
                    </div>
                    <div class="tool-item" id="tool-stone" data-tool="stone" title="Colocar Pedra">
                        <img src="../assets/images/Stone-sembg.png" class="icon">
                        <span class="label">Pedras</span>
                        <span class="count" id="stone-count">0</span>
                    </div>
                </div>
                <div class="garden-actions">
                    <button id="edit-garden-btn" class="button">Modo Edição</button>
                    <button id="reset-garden-btn" class="button button-danger">Limpar Jardim</button>
                </div>
            </aside>
        </div>
    </div>
    <script src="garden.js"></script>
</body>
</html>
