<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estatísticas - Izy Focus</title>
    <link rel="stylesheet" href="/stats/stats.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Seu Jardim de Foco</h1>
                <p>Aqui estão os insights sobre seus hábitos de produtividade.</p>
            </div>
            <div class="header-actions">
                <a href="/history/history.html" class="button button-secondary">Ver Histórico</a>
            </div>
        </header>

        <main>
            <section class="highlights-grid">
                <div class="card highlight-card">
                    <div class="icon">🎯</div>
                    <h3>Ciclos Completos</h3>
                    <div class="value" id="total-cycles">0</div>
                </div>
                <div class="card highlight-card">
                    <div class="icon">🚀</div>
                    <h3>Lista Mais Usada</h3>
                    <div class="value" id="most-used">--</div>
                </div>
                <div class="card highlight-card">
                    <div class="icon">✅</div>
                    <h3>Maior Taxa de Conclusão</h3>
                    <div class="value" id="most-effective">--</div>
                </div>
            </section>

            <section class="card detailed-stats">
                <h2>Detalhes por Lista de Foco</h2>
                <div id="detailed-list-container">
                    <!-- Conteúdo gerado via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="/stats/stats.js"></script>
</body>
</html>
