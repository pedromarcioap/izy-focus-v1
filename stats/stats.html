<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estatísticas - Izy Focus</title>
    <link rel="stylesheet" href="/stats/stats.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1 data-i18n="stats_header">Seu Jardim de Foco</h1>
                <p data-i18n="stats_subtitle">Aqui estão os insights sobre seus hábitos de produtividade.</p>
            </div>
            <div class="header-actions">
                <a href="/history/history.html" class="button button-secondary" data-i18n="stats_view_history">Ver Histórico</a>
            </div>
        </header>

        <main>
            <section class="highlights-grid">
                <div class="card highlight-card">
                    <div class="icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                        </svg>
                    </div>
                    <h3 data-i18n="stats_completed_cycles">Ciclos Completos</h3>
                    <div class="value" id="total-cycles">0</div>
                </div>
                <div class="card highlight-card">
                    <div class="icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
                        </svg>
                    </div>
                    <h3 data-i18n="stats_most_used">Lista Mais Usada</h3>
                    <div class="value" id="most-used">--</div>
                </div>
                <div class="card highlight-card">
                    <div class="icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <h3 data-i18n="stats_highest_completion">Maior Taxa de Conclusão</h3>
                    <div class="value" id="most-effective">--</div>
                </div>
            </section>

            <section class="card detailed-stats">
                <h2 data-i18n="stats_details_by_list">Detalhes por Lista de Foco</h2>
                <div id="detailed-list-container">
                    <!-- Conteúdo gerado via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="/stats/stats.js"></script>
</body>
</html>
