<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Estatísticas - Izy Focus</title>
    <link rel="stylesheet" href="../assets/common.css">
    <link rel="stylesheet" href="stats.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container">
        <header class="main-header">
            <a href="../popup/popup.html" class="back-link">← Voltar</a>
            <h1>Estatísticas</h1>
        </header>

        <main>
            <section class="stats-grid">
                <div class="card stat-highlight">
                    <h3>Ciclos Completos</h3>
                    <p id="total-cycles">0</p>
                </div>
                <div class="card stat-highlight">
                    <h3>Lista Mais Usada</h3>
                    <p id="most-used">--</p>
                </div>
                <div class="card stat-highlight">
                    <h3>Sessões Interrompidas</h3>
                    <p id="total-interruptions">0</p>
                </div>
            </section>

            <section class="card">
                <h2>Detalhes por Lista</h2>
                <div id="detailed-list-container">
                    <!-- Conteúdo gerado via JS -->
                </div>
            </section>
        </main>
    </div>
    <script src="stats.js"></script>
</body>
</html>
