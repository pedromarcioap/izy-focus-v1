<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Izy Focus</title>
    <link rel="stylesheet" href="/popup/popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-logo">
                <svg class="logo-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                </svg>
                <h1 id="main-header-title">Izy Focus</h1>
            </div>
            <div class="header-actions">
                <button id="garden-btn" class="icon-btn" aria-label="Jardim" title="Jardim">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </button>
                <button id="stats-btn" class="icon-btn" aria-label="Estatísticas" title="Estatísticas">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3v18h18"/>
                        <path d="M9 17V9"/>
                        <path d="M15 17V5"/>
                        <path d="M21 17v-4"/>
                    </svg>
                </button>
                <button id="settings-btn" class="icon-btn" aria-label="Configurações" title="Configurações">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M12 1v4"/>
                        <path d="M12 19v4"/>
                        <path d="M4.22 4.22l2.83 2.83"/>
                        <path d="M16.95 16.95l2.83 2.83"/>
                        <path d="M1 12h4"/>
                        <path d="M19 12h4"/>
                        <path d="M4.22 19.78l2.83-2.83"/>
                        <path d="M16.95 7.05l2.83-2.83"/>
                    </svg>
                </button>
                <button id="dark-mode-btn" class="icon-btn" aria-label="Modo Escuro" title="Modo Escuro">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2"/>
                        <path d="M12 21v2"/>
                        <path d="M4.22 4.22l1.42 1.42"/>
                        <path d="M18.36 18.36l1.42 1.42"/>
                        <path d="M1 12h2"/>
                        <path d="M21 12h2"/>
                        <path d="M4.22 19.78l1.42-1.42"/>
                        <path d="M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <button id="mute-btn" class="icon-btn" aria-label="Silenciar" title="Silenciar Sons">
                    <svg class="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
                    </svg>
                    <svg class="sound-off-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M23 9l-6 6"/>
                        <path d="M17 9l6 6"/>
                    </svg>
                </button>
            </div>
        </header>

        <div id="home-container" class="view-container">
            <div class="bento-grid">
                <div class="card card-main">
                    <p class="card-label" data-i18n="popup_start_focus">Iniciar Sessão de Foco</p>
                    <div id="quick-start-buttons" class="quick-start-grid"></div>
                </div>
                <div class="stats-row">
                    <div class="card card-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                        </svg>
                        <span class="stat-value" id="seed-count">0</span>
                        <span class="stat-label" data-i18n="popup_seeds_label">Sementes</span>
                    </div>
                    <div class="card card-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2l3 4 1-1 1 4-5-2-5 2 1-4 1 1 3-4z"/>
                        </svg>
                        <span class="stat-value" id="stone-count">0</span>
                        <span class="stat-label" data-i18n="popup_stones_label">Pedras</span>
                    </div>
                    <div class="card card-stat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2c.5 2.5 2 4.5 4 6.5 2 2 3 4.5 3 7.5a4 4 0 01-4 4h-6a4 4 0 01-4-4c0-3 1-5.5 3-7.5 2-2 3.5-4 4-6.5z"/>
                        </svg>
                        <span class="stat-value" id="streak-count">0</span>
                        <span class="stat-label" data-i18n="popup_streak_label">Dias</span>
                    </div>
                </div>
            </div>

            <div class="intention-section">
                <div class="intention-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9-9z"/>
                    </svg>
                    <label for="intention-input" data-i18n="popup_intention_label">Intenção do Dia</label>
                </div>
                <div class="intention-container">
                    <textarea id="intention-input" data-i18n-placeholder="popup_intention_placeholder" maxlength="200" rows="2" placeholder="O que você vai conquistar hoje?"></textarea>
                    <span id="char-count">0/200</span>
                </div>
            </div>
        </div>

        <div id="timer-wrapper" class="view-container timer-container">
            <div class="timer-status">
                <span class="status-dot"></span>
                <span id="status-label" data-i18n="popup_phase_focus">Focando...</span>
            </div>
            <div class="timer-ring-wrapper">
                <svg class="progress-ring" width="220" height="220">
                    <circle class="progress-ring__track" r="100" cx="110" cy="110" fill="none" stroke-width="8"/>
                    <circle class="progress-ring__bar" r="100" cx="110" cy="110" fill="none" stroke-width="8"/>
                </svg>
                <div class="timer-overlay">
                    <div id="plant-container">
                        <svg id="growing-plant" viewBox="0 0 100 100">
                            <path class="stem" d="M50 95V40C50 30 55 30 55 60"/>
                            <path class="leaf leaf-1" d="M55 50 C40 50 40 60 55 60"/>
                            <path class="leaf leaf-2" d="M55 40 C70 40 70 50 55 50"/>
                        </svg>
                    </div>
                    <div id="timer-display">00:00</div>
                </div>
            </div>
            <div id="current-task-label" class="task-label"></div>
            
            <div class="sound-section">
                <button id="sound-toggle-btn" class="sound-toggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
                    </svg>
                    <span data-i18n="popup_sound_toggle">Sons Ambiente</span>
                </button>
                <div id="sound-list" class="sound-list"></div>
            </div>

            <button id="emergency-stop-btn" class="btn btn-danger">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="6" width="12" height="12"/>
                </svg>
                <span data-i18n="popup_emergency_stop">Interromper Sessão</span>
            </button>
        </div>

        <div id="completed-wrapper" class="view-container completed-container">
            <div class="completed-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                </svg>
            </div>
            <h2 data-i18n="popup_cycle_completed_title">Sessão Concluída!</h2>
            <p class="completed-rewards">
                <span class="reward">+1 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/></svg> Semente</span>
                <span class="reward">+50 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 4 1-1 1 4-5-2-5 2 1-4 1 1 3-4z"/></svg> XP</span>
            </p>
            <div class="level-progress">
                <div class="level-info">
                    <span data-i18n="popup_level">Nível</span> <span id="current-level">1</span>
                </div>
                <div class="progress-bar">
                    <div id="xp-progress-fill" class="progress-fill"></div>
                </div>
                <div class="xp-info">
                    <span id="current-xp">0</span> / <span id="next-level-xp">250</span> XP
                </div>
            </div>
            <div class="completed-actions">
                <button id="start-next-cycle-btn" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span data-i18n="popup_start_next_cycle">Próximo Ciclo</span>
                </button>
                <button id="finish-session-btn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                    <span data-i18n="popup_finish_session">Finalizar</span>
                </button>
            </div>
        </div>
    </div>
    <script src="/popup/popup.js"></script>
</body>
</html>
