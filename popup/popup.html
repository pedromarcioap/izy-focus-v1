<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Izy Focus</title>
    <link rel="stylesheet" href="/popup/popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <div id="main-view" class="view">
            <header>
                <h1 id="main-header-title">Izy Focus</h1>
                <div class="header-actions">
                    <a href="#" id="garden-btn" title="Meu Jardim">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                            <path d="M2 17L12 22L22 17"/>
                            <path d="M2 12L12 17L22 12"/>
                        </svg>
                    </a>
                    <a href="#" id="stats-btn" title="Estatísticas">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3V21H21"/>
                            <path d="M9 17V9"/>
                            <path d="M15 17V5"/>
                            <path d="M21 17V13"/>
                        </svg>
                    </a>
                    <a href="#" id="settings-btn" title="Configurações">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M12 1V6M12 18V23M4.22 4.22L7.76 7.76M16.24 16.24L19.78 19.78M1 12H6M18 12H23M4.22 19.78L7.76 16.24M16.24 7.76L19.78 4.22"/>
                        </svg>
                    </a>
                </div>
            </header>
            
            <div id="home-container">
                <div class="bento-grid">
                    <div class="card card-main-action"><p>Comece a focar agora</p><div id="quick-start-buttons"></div></div>
                    <div class="card card-stat"><div class="stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                            <path d="M2 17L12 22L22 17"/>
                            <path d="M2 12L12 17L22 12"/>
                        </svg>
                    </div><div class="stat-value" id="seed-count">0</div><div class="stat-label">Sementes</div></div>
                    <div class="card card-stat"><div class="stat-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="8"/>
                            <path d="M12 2V6M12 18V22M4.22 4.22L7.76 7.76M16.24 16.24L19.78 19.78M1 12H6M18 12H23M4.22 19.78L7.76 16.24M16.24 7.76L19.78 4.22"/>
                        </svg>
                    </div><div class="stat-value" id="stone-count">0</div><div class="stat-label">Pedras</div></div>
                </div>
                <div class="intention-wrapper"><input type="text" id="intention-input" placeholder="Qual é a sua intenção para hoje?"></div>
            </div>

            <div id="timer-wrapper">
                <div class="timer-container">
                    <svg class="progress-ring" width="220" height="220"><circle class="progress-ring__track" r="100" cx="110" cy="110"/><circle class="progress-ring__bar" r="100" cx="110" cy="110"/></svg>
                    <div class="timer-overlay">
                        <div id="plant-container"><svg id="growing-plant" viewBox="0 0 100 100"><path class="stem" d="M50 95V40C50 30 55 30 55 40V60"/><path class="leaf leaf-1" d="M55 50 C40 50 40 60 55 60"/><path class="leaf leaf-2" d="M55 40 C70 40 70 50 55 50"/></svg></div>
                        <h1 id="timer-display">00:00</h1><p id="current-task-label"></p>
                    </div>
                </div>
                <div class="sound-section">
                    <button id="sound-toggle-btn" class="sound-toggle">🎵 Sons Ambiente</button>
                    <div id="sound-list" class="sound-list"></div>
                </div>
                <div class="timer-actions">
                    <button id="emergency-stop-btn">Interromper</button>
                </div>
            </div>

            <div id="completed-wrapper">
                <div class="completed-icon">🎉</div>
                <h2>Ciclo Concluído!</h2>
                <p>Você ganhou <strong>1 Semente de Foco</strong> 🌱. O que você gostaria de fazer agora?</p>
                <div class="completed-actions">
                    <button id="start-next-cycle-btn">Iniciar Próximo Ciclo</button>
                    <button id="finish-session-btn" class="button-secondary">Finalizar e Voltar ao Início</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/popup/popup.js"></script>
</body>
</html>
