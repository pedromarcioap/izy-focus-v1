<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Izy Focus</title>
    <link rel="stylesheet" href="../assets/common.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="container">
        <div id="main-view">
            <header class="main-header">
                <h1>Izy Focus</h1>
                <div class="header-icons">
                    <a href="#" id="garden-btn" title="Meu Jardim"><img src="../assets/icons/plant.svg" alt="Meu Jardim"></a>
                    <a href="#" id="stats-btn" title="Estatísticas"><img src="../assets/icons/stats.svg" alt="Estatísticas"></a>
                    <a href="#" id="settings-btn" title="Configurações"><img src="../assets/icons/settings.svg" alt="Configurações"></a>
                </div>
            </header>
            
            <main id="home-container">
                <div class="quick-start-section card">
                    <p>Comece a focar agora</p>
                    <div id="quick-start-buttons"></div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card card">
                        <span class="stat-value" id="seed-count">0</span>
                        <span class="stat-label">Sementes</span>
                    </div>
                    <div class="stat-card card">
                        <span class="stat-value" id="stone-count">0</span>
                        <span class="stat-label">Pedras</span>
                    </div>
                </div>
                <input type="text" id="intention-input" placeholder="Qual é a sua intenção para hoje?">
            </main>

            <div id="timer-wrapper">
                <div class="timer-display-wrapper">
                    <h2 id="timer-display">00:00</h2>
                    <p id="current-task-label"></p>
                </div>
                <div class="timer-actions">
                    <button id="emergency-stop-btn" class="btn">Interromper</button>
                </div>
            </div>

            <div id="completed-wrapper" class="card">
                <h2>Ciclo Concluído!</h2>
                <p>Você ganhou <strong>1 Semente</strong>.</p>
                <div class="completed-actions">
                    <button id="start-next-cycle-btn" class="btn btn-primary">Próximo Ciclo</button>
                    <button id="finish-session-btn" class="btn btn-secondary">Finalizar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
