<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Histórico - Izy Focus</title>
    <link rel="stylesheet" href="/history/history.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-logo">
                <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2C7 2 3 7 3 10c0 4 3 7 9 9-1-6 0-12-6-14 0 0 3 2 6 3z"/>
                </svg>
                <h1 data-i18n="history_header">Histórico</h1>
            </div>
            <div class="header-actions">
                <button id="dark-mode-btn" class="icon-btn" aria-label="Modo Escuro">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <button id="export-csv-btn" class="btn btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>
                    </svg>
                    <span>Exportar CSV</span>
                </button>
            </div>
        </header>

        <div class="summary-cards">
            <div class="summary-card">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
                </svg>
                <div class="summary-content">
                    <span class="summary-value" id="total-time">0h</span>
                    <span class="summary-label">Tempo Total</span>
                </div>
            </div>
            <div class="summary-card">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
                </svg>
                <div class="summary-content">
                    <span class="summary-value" id="total-sessions">0</span>
                    <span class="summary-label">Sessões</span>
                </div>
            </div>
            <div class="summary-card">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
                </svg>
                <div class="summary-content">
                    <span class="summary-value" id="completion-rate">0%</span>
                    <span class="summary-label">Taxa de Conclusão</span>
                </div>
            </div>
        </div>

        <div class="filters">
            <select id="filter-list" class="filter-select">
                <option value="all">Todas as listas</option>
            </select>
            <select id="filter-period" class="filter-select">
                <option value="all">Todo o período</option>
                <option value="today">Hoje</option>
                <option value="week">Esta semana</option>
                <option value="month">Este mês</option>
            </select>
        </div>

        <div class="filter-summary" id="filter-summary">
            <span>Filtrado: <strong id="filtered-time">0m</strong></span>
        </div>

        <main id="history-log-container" class="history-list">
            <!-- O histórico será inserido aqui pelo JavaScript -->
        </main>
    </div>
    <script src="/history/history.js"></script>
</body>
</html>
